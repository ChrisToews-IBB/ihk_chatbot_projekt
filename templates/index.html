<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swoppen Support Chatbot</title>
    <!-- Verlinkung zur ausgelagerten CSS-Datei im static/css/ Ordner -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            Swoppen Support Chatbot
        </div>
        
        <!-- Chat-Fenster -->
        <div id="chat-fenster">
            <p class="bot"><strong>Bot:</strong> Guten Tag! Ich bin der Swoppen Support Chatbot. Wie kann ich Ihnen bei Ihrem Anliegen behilflich sein?</p>
        </div>

        <!-- Eingabebereich -->
        <div class="input-area">
            <input type="text" id="benutzer-eingabe" placeholder="Ihre Nachricht eingeben..." autofocus>
            <button id="sende-button">Senden</button>
        </div>
    </div>

    <!-- Verlinkung zur ausgelagerten JS-Datei im static/js/ Ordner -->
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>

</body>
</html>
